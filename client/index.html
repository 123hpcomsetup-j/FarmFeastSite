<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>FarmFeast Farmhouse – Nature Stay & Events in Keesara</title>
    
    <!-- Performance optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="//api.farmfeastfarmhouse.co.in">
    
    <!-- Resource hints for faster LCP -->
    <link rel="preload" href="/api/placeholder/800/600" as="image" fetchpriority="high">
    <link rel="modulepreload" href="/src/main.tsx">
    
    <!-- Critical CSS Optimization: Load only essential font weights -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" as="style">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"></noscript>
    
    <!-- Defer additional font weights until needed -->
    <script>
      const loadAdditionalFonts = () => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap';
        document.head.appendChild(link);
      };
      ['scroll', 'mousedown', 'touchstart'].forEach(event => {
        document.addEventListener(event, loadAdditionalFonts, { once: true, passive: true });
      });
      setTimeout(loadAdditionalFonts, 3000);
    </script>
    
    <!-- Critical CSS inline for fastest render -->
    <style>
      /* Critical above-the-fold styles */
      * { box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; line-height: 1.5; }
      .hero-gradient { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); }
      .max-w-7xl { max-width: 80rem; margin: 0 auto; }
      .px-4 { padding-left: 1rem; padding-right: 1rem; }
      .py-12 { padding-top: 3rem; padding-bottom: 3rem; }
      .grid { display: grid; }
      .lg\\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .gap-12 { gap: 3rem; }
      .items-center { align-items: center; }
      .text-4xl { font-size: 2.25rem; line-height: 2.5rem; }
      .font-bold { font-weight: 700; }
      .text-primary { color: #22c55e; }
      .leading-tight { line-height: 1.25; }
      .space-y-6 > * + * { margin-top: 1.5rem; }
      .space-y-4 > * + * { margin-top: 1rem; }
      .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
      .text-muted-foreground { color: #525252; }
      .leading-relaxed { line-height: 1.625; }
      .rounded-2xl { border-radius: 1rem; }
      .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
      .aspect-4-3 { aspect-ratio: 4/3; }
      .w-full { width: 100%; }
      .h-full { height: 100%; }
      .object-cover { object-fit: cover; }
      .overflow-hidden { overflow: hidden; }
      .relative { position: relative; }
      .absolute { position: absolute; }
      .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
      .bg-gradient-to-t { background-image: linear-gradient(to top, var(--tw-gradient-stops)); }
      .from-black-20 { --tw-gradient-from: rgba(0, 0, 0, 0.2); --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to, rgba(0, 0, 0, 0)); }
      .to-transparent { --tw-gradient-to: transparent; }
      
      /* Navbar critical styles */
      .bg-background { background-color: #ffffff; }
      .border-b { border-bottom-width: 1px; }
      .border-border { border-color: #e4e4e7; }
      .sticky { position: sticky; }
      .top-0 { top: 0; }
      .z-50 { z-index: 50; }
      .h-16 { height: 4rem; }
      .flex { display: flex; }
      .justify-between { justify-content: space-between; }
      .text-2xl { font-size: 1.5rem; line-height: 2rem; }
      .text-primary { color: #22c55e; }
      
      /* Loading states */
      .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
      .animate-spin { animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      
      /* Critical responsive only */
      @media (min-width: 1024px) {
        .lg\\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .lg\\:text-6xl { font-size: 3.75rem; line-height: 1; }
      }
      .loader { display: flex; justify-content: center; align-items: center; height: 100vh; }
      .spinner { width: 2rem; height: 2rem; border: 2px solid #e5e5e5; border-top: 2px solid #22c55e; border-radius: 50%; animation: spin 1s linear infinite; }
      
      /* Optimized loading states */
      .lazy-load { opacity: 0; transition: opacity 0.3s ease; }
      .lazy-load.loaded { opacity: 1; }
      
      /* Passive Event & Scroll Performance Optimizations */
      * { touch-action: manipulation; }
      html { scroll-behavior: smooth; }
      body { -webkit-overflow-scrolling: touch; }
      .passive-scroll { will-change: scroll-position; }
      .scroll-optimized { contain: layout style paint; }
      
      /* Animation performance with GPU acceleration */
      .animate-fade-in { animation: fadeIn 0.3s ease-out; }
      .animate-slide-up { animation: slideUp 0.4s ease-out; }
      .animate-scale-in { animation: scaleIn 0.3s ease-out; }
      
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- JavaScript optimization: Defer non-critical scripts -->
    <script>
      // Defer Replit banner until user interaction to reduce network activity
      const loadReplitBanner = () => {
        const script = document.createElement('script');
        script.src = 'https://replit.com/public/js/replit-dev-banner.js';
        script.defer = true;
        script.async = true;
        document.head.appendChild(script);
      };
      
      // Load on first user interaction - saves initial bandwidth
      ['mousedown', 'touchstart', 'keydown', 'scroll'].forEach(event => {
        document.addEventListener(event, loadReplitBanner, { once: true, passive: true });
      });
      
      // Fallback timeout for non-interactive users
      setTimeout(loadReplitBanner, 8000);
    </script>
  </body>
</html>
